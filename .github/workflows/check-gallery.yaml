name: Check gallery

on:
  push:
    branches: [main]
    paths:
      - "gallery/**"
      - ".github/workflows/check-gallery.yaml"
  pull_request:
    paths:
      - "gallery/**"
      - ".github/workflows/check-gallery.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Every example app and the shell itself must at least parse. This
      # catches a broken app.R without installing shiny or booting 126
      # processes, which a runtime check of this gallery would need.
      - name: Parse every R file
        run: |
          Rscript -e '
            files <- list.files("gallery", pattern = "[.]R$", recursive = TRUE, full.names = TRUE)
            bad <- character()
            for (f in files) {
              ok <- tryCatch({ parse(f); TRUE }, error = function(e) { message(f, ": ", conditionMessage(e)); FALSE })
              if (!ok) bad <- c(bad, f)
            }
            cat(length(files), "R files parsed\n")
            if (length(bad)) { cat("failed:", length(bad), "\n"); quit(status = 1) }
          '

      # The no-build variant is hand-written JavaScript, so nothing else
      # would notice a syntax error in it before someone opened the page.
      - name: Syntax-check the hand-written rpkg clients
        run: |
          shopt -s nullglob
          count=0
          for f in gallery/apps/*/rpkg/www/ui.js; do
            node --check "$f"
            count=$((count + 1))
          done
          echo "$count rpkg clients checked"

      # gallery is an npm workspace, so the lockfile lives at the root and
      # `npm ci` has to run there.
      - name: Install
        run: npm ci

      # Each example's react/www/ui.js is a build artifact that ships
      # committed, so it can silently fall behind its own src/. Rebuilding
      # and diffing is the only thing that catches that drift.
      - name: Rebuild the react clients
        run: npm run build --workspace gallery

      - name: Fail if a committed bundle is stale
        run: |
          if ! git diff --quiet -- 'gallery/apps/*/react/www/'; then
            echo "A committed react/www/ui.js differs from a fresh build."
            echo "Run 'npm run build' in gallery/ and commit the result."
            git diff --stat -- 'gallery/apps/*/react/www/'
            exit 1
          fi
          echo "every committed bundle matches its source"

      - name: Typecheck
        run: npm run typecheck --workspace gallery
