name: Deploy gallery

on:
  push:
    branches: [main]
    paths:
      - "gallery/**"
      - ".github/workflows/gallery-deploy.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages the gallery's classic apps need
        run: install.packages(c("shiny", "bslib", "shinylive"))
        shell: Rscript {0}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install npm dependencies
        run: npm ci

      - name: Build the gallery (shell, then the classic apps via shinylive)
        working-directory: gallery
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: gallery/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
