name: release-py

# Publish the Python package to PyPI when a release is published.
#
# Authentication is PyPI Trusted Publishing (OIDC), so there is no API token in
# repository secrets. PyPI decides whether to trust a request by matching the
# repository, this file's name, and the environment named below, so none of the
# three can be renamed without updating the publisher on PyPI to match.
#
# workflow_dispatch is here because a release can only be published once. If the
# build or the upload fails, the release still exists, and a manual run against
# the tag is the way to retry without inventing a version.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      # The R, Python, and JS packages share one version. Check it before
      # building, while a mismatch is still free to fix: PyPI refuses to replace
      # a version once uploaded, so a wrong number here can only be abandoned.
      - name: Check the versions agree with the tag
        run: python tools/check_versions.py ${{ github.event.release.tag_name }}

      - name: Build the sdist and the wheel
        run: uv build --out-dir dist

      # The package is useless without its vendored bundle: a wheel missing
      # www/bslibreact.js installs cleanly and then serves a page with no
      # components on it. That cannot be undone after upload, so it is a check
      # of its own.
      - name: Check the artifacts carry the vendored bundle
        run: python tools/check_dist.py dist

      - name: Check the metadata renders
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # A job-level permissions block replaces the defaults rather than adding
      # to them, so id-token is all this job gets. It needs nothing else: the
      # artifact comes from the build job, not from a checkout.
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/bslibreact
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
