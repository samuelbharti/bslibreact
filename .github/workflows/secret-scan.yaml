name: Secret scan

# Pushes to main, and pull requests: a push to a PR branch is already
# scanned through its pull request, so scanning both doubled the runs. The
# prek gitleaks hook still checks every commit locally, any branch.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # On a pull request, gitleaks-action lists the PR's commits through the
  # API, which needs this; without it the scan stops with a 403.
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Inline PR comments need pull-requests: write. A finding still
          # fails the job and shows in its log.
          GITLEAKS_ENABLE_COMMENTS: false
