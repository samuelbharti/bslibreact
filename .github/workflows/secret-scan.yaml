name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read
  # On a pull request, gitleaks-action lists the PR's commits through the
  # API, which needs this; without it the scan stops with a 403.
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
