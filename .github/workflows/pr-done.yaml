name: PR done

on:
  pull_request:

permissions:
  contents: read
  checks: read

jobs:
  wait:
    runs-on: ubuntu-latest
    steps:
      - uses: poseidon/wait-for-status-checks@e7e24423722c5b8e97a6dd5848827d2a412f812d # v0.7.0
        with:
          token: ${{ github.token }}
          delay: 15
          ignore: "PR done"
