name: PR done

on:
  pull_request:

permissions:
  contents: read
  checks: read

jobs:
  wait:
    runs-on: ubuntu-latest
    steps:
      - uses: poseidon/wait-for-status-checks@6988432d64ad3f9c2608db4ca16fded1b7d36ead # v0.5.0
        with:
          token: ${{ github.token }}
          delay: 15
          ignore: "PR done"
