name: Check JS

on:
  push:
    branches: [main]
    paths: &check-js-inputs
      - "pkg-js/**"
      - "pkg-r/R/catalog*.R"
      - "pkg-r/DESCRIPTION"
      - "pkg-py/src/bslibreact/_catalog*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "markup-versions.json"
      - "tools/markup/**"
      - "docs/markup-catalog.md"
      - "Makefile"
      - ".github/workflows/check-js.yaml"
  pull_request:
    paths: *check-js-inputs
  workflow_call:
    inputs:
      latest:
        description: "Install the newest bslib, shiny, and py-shiny instead of the pinned versions."
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BSLIBREACT_REQUIRE_CATALOG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read node version
        id: nvm
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "${{ steps.nvm.outputs.version }}"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          working-directory: pkg-r
          # tools/markup/render-r.R loads pkg-r with pkgload and renders the
          # "extra" catalog samples, the ones whose markup comes from a
          # package bslibreact itself deliberately does not depend on.
          # Without these the samples render as null and the markup tests
          # compare against nothing.
          extra-packages: |
            any::DT
            any::reactable
            any::shinycssloaders
            any::htmlwidgets
            any::pkgload

      - name: Install pinned bslib and shiny
        if: ${{ !inputs.latest }}
        run: |
          Rscript -e '
            v <- jsonlite::fromJSON("markup-versions.json")
            pak::pkg_install(sprintf("bslib@%s", v$r$bslib))
            pak::pkg_install(sprintf("shiny@%s", v$r$shiny))
          '

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Sync Python dependencies
        run: |
          if [ "${{ inputs.latest }}" = "true" ]; then
            uv sync --upgrade-package shiny
          else
            uv sync
          fi

      - run: make js-setup-ci
      - run: make js-format-check
      - run: make js-lint
      - run: make js-test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: markup-catalog
          path: .cache/markup/*.json
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: make js-setup-ci
      - run: make update-dist
      - run: git status --porcelain
      - name: Fail if update-dist changed anything
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "make update-dist produced a diff. Commit the result." >&2
            git status --porcelain >&2
            exit 1
          fi
