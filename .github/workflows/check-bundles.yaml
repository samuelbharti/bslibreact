name: Check bundles

# The example apps and the gallery's react apps each commit a built
# www/ui.js, and each of those bundles a copy of bslib-react. So a change in
# pkg-js can make them stale as surely as a change in their own src/ can,
# which is why pkg-js is in the paths below too.
on:
  push:
    branches: [main]
    paths:
      - "gallery/**"
      - "examples/**"
      - "pkg-js/src/**"
      - "pkg-js/package.json"
      - "pkg-js/vite.config.npm.ts"
      - "package-lock.json"
      - ".github/workflows/check-bundles.yaml"
  pull_request:
    paths:
      - "gallery/**"
      - "examples/**"
      - "pkg-js/src/**"
      - "pkg-js/package.json"
      - "pkg-js/vite.config.npm.ts"
      - "package-lock.json"
      - ".github/workflows/check-bundles.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Every example app and the shell itself must at least parse. This
      # catches a broken app.R without installing shiny or booting 126
      # processes, which a runtime check of this gallery would need.
      - name: Parse every gallery R file
        run: |
          Rscript -e '
            files <- list.files("gallery", pattern = "[.]R$", recursive = TRUE, full.names = TRUE)
            bad <- character()
            for (f in files) {
              ok <- tryCatch({ parse(f); TRUE }, error = function(e) { message(f, ": ", conditionMessage(e)); FALSE })
              if (!ok) bad <- c(bad, f)
            }
            cat(length(files), "R files parsed\n")
            if (length(bad)) { cat("failed:", length(bad), "\n"); quit(status = 1) }
          '

      # The no-build variant is hand-written JavaScript, so nothing else
      # would notice a syntax error in it before someone opened the page.
      - name: Syntax-check the hand-written rpkg clients
        run: |
          shopt -s nullglob
          count=0
          for f in gallery/apps/*/rpkg/www/ui.js; do
            node --check "$f"
            count=$((count + 1))
          done
          echo "$count rpkg clients checked"

      # The examples and the gallery are npm workspaces, so the lockfile
      # lives at the root and `npm ci` has to run there.
      - name: Install
        run: npm ci

      # Both import bslib-react, whose package entry points into
      # pkg-js/dist-npm, a build artifact that is gitignored. A fresh
      # checkout has to build it before anything can resolve the import.
      - name: Build the bslib-react package
        run: npm run build --workspace pkg-js

      - name: Rebuild the example clients
        run: npm run build --workspace examples/01-hello --workspace examples/volcano-plot

      - name: Rebuild the gallery react clients
        run: npm run build --workspace gallery

      # Rebuilding and diffing is the only thing that catches a committed
      # bundle that has fallen behind its source.
      - name: Fail if a committed bundle is stale
        run: |
          bundles=('examples/*/www/' 'gallery/apps/*/react/www/')
          if ! git diff --quiet -- "${bundles[@]}"; then
            echo "A committed www/ui.js differs from a fresh build."
            echo "Run 'make examples' and 'make gallery-apps', then commit the result."
            git diff --stat -- "${bundles[@]}"
            exit 1
          fi
          echo "every committed bundle matches its source"

      - name: Typecheck the gallery
        run: npm run typecheck --workspace gallery
