name: Check R

on:
  push:
    branches: [main]
    paths:
      - "pkg-r/**"
      - ".github/workflows/check-r.yaml"
  pull_request:
    paths:
      - "pkg-r/**"
      - ".github/workflows/check-r.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # On a pull request from this repository, routine reads the PR through
  # the API and pushes its air and document() fixes back to the PR branch,
  # so it needs these two. It has no input to skip the push.
  routine:
    permissions:
      contents: write
      pull-requests: read
    uses: rstudio/shiny-workflows/.github/workflows/routine.yaml@46349e2cc2ec4e10ddb6afbb0d2d289bc82a27c6 # v1
    with:
      working-directory: pkg-r
      format-r-code: true
      check-js: false

  R-CMD-check:
    uses: rstudio/shiny-workflows/.github/workflows/R-CMD-check.yaml@46349e2cc2ec4e10ddb6afbb0d2d289bc82a27c6 # v1
    with:
      working-directory: pkg-r
