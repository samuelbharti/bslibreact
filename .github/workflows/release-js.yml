name: release-js

# Publish the JavaScript package to npm when a release is published.
#
# Authentication is npm Trusted Publishing (OIDC), so there is no token in
# repository secrets, and the build is published with provenance. The trusted
# publisher on npm must name this repository and this workflow file, so neither
# can be renamed without updating it to match. The trusted publisher allows
# `npm publish` and nothing else.
#
# workflow_dispatch is here because a release can only be published once. If the
# build or upload fails, a manual run against the tag retries it.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance / trusted publishing
      contents: read
    defaults:
      run:
        working-directory: pkg-js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The current Node LTS, not a fixed version: npm's own minimum supported
      # Node keeps moving forward, and Trusted Publishing needs npm 11.5.1 or
      # newer. Node 20's bundled npm 10 has no OIDC exchange and fails with
      # ENEEDAUTH at publish time.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      # A fixed version, since this job holds the publish credentials: a new
      # npm release changes nothing here until someone bumps this on purpose.
      - name: Update npm for trusted publishing
        run: npm install -g npm@11.21.0 && npm --version

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The R, Python, and JS packages share one version. Check it before
      # building, while a mismatch is still free to fix: npm refuses to replace
      # a version once published.
      - name: Check the versions agree with the tag
        run: python tools/check_versions.py ${{ github.event.release.tag_name }}
        working-directory: ${{ github.workspace }}

      # pkg-js is an npm workspace, so the lockfile is at the repository root
      # and `npm ci` has to run there.
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Build
        run: npm run build

      # The package entry points into dist-npm/, which is gitignored and only
      # exists after the build above. A tarball without it installs fine and
      # then fails to resolve for every user, and npm will not replace a
      # published version, so this is a check of its own.
      - name: Check the tarball carries the built entry points
        run: node scripts/check-pack.mjs

      - name: Publish to npm
        run: npm publish --provenance --access public
