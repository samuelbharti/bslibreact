url: https://www.samuelbharti.com/bslibreact/r

template:
  bootstrap: 5
  light-switch: true

home:
  title: bslibreact
  description: >
    Give a shinyreact page the CSS and JavaScript a bslib page would attach,
    and host server-rendered Shiny widgets inside a React client.

navbar:
  structure:
    left: [articles, reference, news]
    right: [search, hub, python, javascript, github, lightswitch]
  components:
    hub:
      text: All docs
      href: https://www.samuelbharti.com/bslibreact/
    python:
      text: Python docs
      href: https://www.samuelbharti.com/bslibreact/py/
    javascript:
      text: JavaScript docs
      href: https://www.samuelbharti.com/bslibreact/js/
    github:
      icon: fab fa-github
      href: https://github.com/samuelbharti/bslibreact
      aria-label: GitHub

articles:
- title: Articles
  navbar: ~
  contents:
  - articles/get-started
  - articles/volcano-plot
  - articles/gallery

reference:
- title: Page dependencies
  desc: >
    Collect the CSS and JavaScript a page needs, and host a server-rendered
    widget for a client to display.
  contents:
  - page_deps
  - bslibreact_dep
  - host_input
