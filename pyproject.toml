[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bslib-react"
version = "0.1.0"
description = "Server helpers for bslib-react, React components that reproduce bslib and Shiny markup"
readme = "pkg-py/README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samuel Bharti", email = "samuelbharti.io@gmail.com" }]
keywords = ["shiny", "bslib", "react", "shinyreact"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.10"
dependencies = ["shiny>=1.8.0", "htmltools>=0.7.0"]

[project.urls]
Homepage = "https://github.com/samuelbharti/bslib-react"
Repository = "https://github.com/samuelbharti/bslib-react"
Changelog = "https://github.com/samuelbharti/bslib-react/blob/main/pkg-py/CHANGELOG.md"
Issues = "https://github.com/samuelbharti/bslib-react/issues"

[tool.hatch.build.targets.sdist]
only-include = ["pkg-py/src", "pkg-py/README.md", "pkg-py/CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["pkg-py/src/bslib_react"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "httpx>=0.27.0", "pyright>=1.1.0", "ruff>=0.6.0", "pytest-cov>=5.0.0"]
docs = ["quartodoc>=0.11.0", "griffe<2"]
examples = ["pandas>=2.1.0", "matplotlib>=3.8.0", "brand_yml>=0.1.0", "shinyreact>=0.1.0"]

[tool.pytest.ini_options]
testpaths = ["pkg-py/tests", "examples"]

[tool.pyright]
include = ["pkg-py/src/bslib_react", "pkg-py/tests", "examples"]
exclude = ["**/node_modules", "**/www"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 88
extend-exclude = ["**/www"]

[tool.ruff.lint]
select = ["E", "F", "I"]
